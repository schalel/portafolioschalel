<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Cajas</title>
    <style>
        body {
            margin: 0;
            padding: 8px 8px 40px;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 183, 77, 0.22), transparent 24%),
                radial-gradient(circle at 82% 16%, rgba(0, 217, 255, 0.24), transparent 22%),
                radial-gradient(circle at 72% 82%, rgba(167, 107, 255, 0.22), transparent 26%),
                radial-gradient(circle at 48% 54%, rgba(255, 92, 154, 0.14), transparent 28%),
                linear-gradient(135deg, #08111d 0%, #11203a 34%, #12324e 67%, #0a7282 100%);
            background-size: 220% 220%;
            background-attachment: fixed;
            animation: fondo 14s ease infinite;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(50px);
            opacity: 0.42;
            z-index: 0;
        }

        body::before {
            width: 300px;
            height: 300px;
            left: -80px;
            top: 10%;
            background: rgba(255, 166, 77, 0.2);
        }

        body::after {
            width: 360px;
            height: 360px;
            right: -110px;
            bottom: -60px;
            background: rgba(0, 217, 255, 0.18);
        }

        .back-button {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 999px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(10, 18, 32, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            background: rgba(18, 30, 52, 0.7);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.24);
        }

        .back-button .arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #4facfe, #c2e9fb);
            color: #0b1730;
            font-weight: 800;
        }

        @keyframes fondo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .caja {
            width: 400px;
            height: 400px;
            margin: auto 200px;
            background: linear-gradient(rgba(0, 92, 212, 0.925), rgba(226, 36, 36, 0.836));
            margin-bottom: 5px;
            box-shadow: 30px 20px 40px solid black;
            border-radius: 0cap20px;
            position: relative;
            z-index: 1;
        }

        .cristiano {
            display: flex;
            margin: auto;
            border: solid blue 5px;
            border-radius: 50%;
            width: 250px;
            height: 250px;
        }

        .cristiano:hover {
            border: solid 5px red;
        }

        .caja2 {
            margin-left: 400px;
        }

        @media (max-width: 640px) {
            body {
                padding: 72px 12px 28px;
            }

            .back-button {
                top: 14px;
                left: 14px;
                padding: 10px 14px;
                gap: 8px;
                font-size: 0.9rem;
            }

            .back-button .arrow {
                width: 24px;
                height: 24px;
            }

            .caja {
                width: calc(100% - 16px);
                height: auto;
                margin: 0 auto 14px;
                padding: 24px 0;
            }

            .caja2 {
                margin-left: auto;
            }

            .cristiano {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button" aria-label="Volver al portafolio">
        <span class="arrow">&larr;</span>
        Volver al portafolio
    </a>

    <div class="caja">
        <img class="cristiano" src="img/CR7 PLANET.jfif" alt="">
    </div>

    <div class="caja caja2">
        <img class="cristiano" src="img/CR7 PLANET.jfif" alt="">
    </div>

    <div class="caja caja3">
        <img class="cristiano" src="img/CR7 PLANET.jfif" alt="">
    </div>
</body>
</html>
