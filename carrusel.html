<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel Sencillo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: system-ui, -apple-system, sans-serif;
            position: relative;
            overflow: hidden;
        }

        .back-button {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 999px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(20, 28, 45, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            background: rgba(29, 41, 66, 0.72);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.2);
        }

        .back-button .arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #10243d;
            font-weight: 800;
        }

        .carousel-container {
            position: relative;
            width: 90%;
            max-width: 700px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: white;
            font-weight: bold;
        }

        .slide:nth-child(1) { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
        .slide:nth-child(2) { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .slide:nth-child(3) { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); }
        .slide:nth-child(4) { background: linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%); color: #333; }

        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, transform 0.2s;
            backdrop-filter: blur(4px);
        }

        .carousel-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .dots-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .dot.active {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.2);
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        @media (max-width: 640px) {
            .back-button {
                top: 14px;
                left: 14px;
                padding: 10px 14px;
                gap: 8px;
                font-size: 0.9rem;
            }

            .back-button .arrow {
                width: 24px;
                height: 24px;
            }

            .carousel-container {
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-button" aria-label="Volver al portafolio">
        <span class="arrow">&larr;</span>
        Volver al portafolio
    </a>

    <div class="carousel-container">
        <div class="carousel-track" id="track">
            <div class="slide">movimiento 1</div>
            <div class="slide">movimiento 2</div>
            <div class="slide">movimiento 3</div>
            <div class="slide">movimiento 4</div>
        </div>

        <button class="carousel-button prev-btn" id="prevBtn">&#10094;</button>
        <button class="carousel-button next-btn" id="nextBtn">&#10095;</button>

        <div class="dots-container" id="dotsContainer"></div>
    </div>

    <script>
        const track = document.getElementById('track');
        const slides = Array.from(track.children);
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const dotsContainer = document.getElementById('dotsContainer');
        
        let currentIndex = 0;

        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.dataset.index = index;
            dotsContainer.appendChild(dot);
        });

        const dots = Array.from(dotsContainer.children);

        function updateCarousel(index) {
            track.style.transform = `translateX(-${index * 100}%)`;
            
            dots.forEach(dot => dot.classList.remove('active'));
            dots[index].classList.add('active');
        }

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex === slides.length - 1) ? 0 : currentIndex + 1;
            updateCarousel(currentIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex === 0) ? slides.length - 1 : currentIndex - 1;
            updateCarousel(currentIndex);
        });

        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                currentIndex = parseInt(e.target.dataset.index);
                updateCarousel(currentIndex);
            });
        });
    </script>

</body>
</html>
